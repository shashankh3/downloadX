name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Lint
        run: npm run lint
      - name: Release manifests
        run: npm run check:release
      - name: Installer + extension packaging tests
        run: node test/installer.test.mjs
      - name: Engine self-tests
        run: node test/self-test.mjs
      - name: Unit tests
        run: node test/units.test.mjs
      - name: API + security tests
        run: node test/api.test.mjs
      - name: Network proxy + auth tests
        run: node test/net.test.mjs
      - name: HLS + DASH stream tests
        run: node test/streams.test.mjs
      - name: FTP protocol tests
        run: node test/ftp.test.mjs
      - name: Extension connector tests
        run: node test/extension.test.mjs
      - name: Web UI tests
        run: node test/ui.test.mjs
      - name: End-to-end test
        run: node test/e2e.test.mjs
      - name: Integration tests
        run: node test/run-tests.mjs
      - name: Local pause/resume tests
        run: node test/local-test.mjs
