name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check server.js && node --check lib/engine.js && node --check lib/httpget.js && node --check lib/ftp.js && node --check lib/streams.js && node --check lib/patterns.js && node --check lib/store.js && node --check lib/bucket.js && node --check lib/instance.js && node --check lib/protocol.js && node --check installer/crx.js && node --check installer/extension-tools.js && node --check installer/prepare-extension.mjs && node --check installer/make-packages.mjs && node --check extension/background.js && node --check extension/content.js && node --check extension/options.js && node --check public/app.js
      - name: Installer + extension packaging tests
        run: node test/installer.test.mjs
      - name: Engine self-tests
        run: node test/self-test.mjs
      - name: API + security tests
        run: node test/api.test.mjs
      - name: Network proxy + auth tests
        run: node test/net.test.mjs
      - name: HLS + DASH stream tests
        run: node test/streams.test.mjs
      - name: FTP protocol tests
        run: node test/ftp.test.mjs
      - name: Extension connector tests
        run: node test/extension.test.mjs
      - name: Integration tests
        run: node test/run-tests.mjs
      - name: Local pause/resume tests
        run: node test/local-test.mjs
